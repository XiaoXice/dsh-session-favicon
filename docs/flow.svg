<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
  </marker></defs>

<!-- Host -->
<rect x="24" y="40" width="300" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="38" y="64" font-size="13" font-weight="700" fill="#0f172a">Host 半边（Node 进程）</text>
<g><rect x="38" y="78" width="150" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="46" y="94" font-size="11" fill="#0f172a">agent/status</text></g>
<g><rect x="196" y="78" width="112" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="204" y="94" font-size="11" fill="#0f172a">agent/error</text></g>
<g><rect x="38" y="108" width="150" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="46" y="124" font-size="11" fill="#0f172a">approval/request</text></g>
<g><rect x="196" y="108" width="138" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="204" y="124" font-size="11" fill="#0f172a">user-questions/request</text></g>
<rect x="38" y="146" width="272" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="164" font-size="11.5" fill="#0f172a">每会话状态机</text>
<text x="50" y="180" font-size="10.5" fill="#64748b">running / asking / done / error + since</text>
<rect x="38" y="200" width="272" height="34" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="222" font-size="11.5" fill="#0f172a">GET /dsh-session-favicon.json</text>

<path d="M 120 132 L 120 146" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 120 190 L 120 200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 324 217 L 420 217" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="210" font-size="10.5" fill="#64748b">JSON：aggregate + sessions{id:{state,since}}</text>

<!-- Browser -->
<rect x="420" y="40" width="316" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="434" y="64" font-size="13" font-weight="700" fill="#0f172a">浏览器·每个标签页各一份</text>
<g><rect x="434" y="78" width="288" height="24" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="442" y="94" font-size="11" fill="#0f172a">Slot props.sessionId → 本标签页是哪个会话</text></g>
<rect x="434" y="112" width="288" height="34" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="446" y="134" font-size="11.5" fill="#0f172a">每 800ms 轮询，只取 sessions[自己的 id]</text>
<rect x="434" y="156" width="288" height="34" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="446" y="178" font-size="11.5" fill="#0f172a">canvas 合成：原图标 + 右下角徽标</text>
<rect x="434" y="200" width="288" height="34" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="446" y="222" font-size="11.5" fill="#0f172a">写回 link[rel=icon]，保留 media 明暗</text>
<path d="M 578 146 L 578 156" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 578 190 L 578 200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="24" y="286" font-size="12" font-weight="600" fill="#0f172a">关键点：会话身份只来自 Slot props，不来自 URL</text>
<text x="24" y="306" font-size="11" fill="#64748b">DSH web 没有会话路由，多个标签页共享同一份聚合快照；所以每个标签页必须自己取自己那一行。</text>
<text x="24" y="324" font-size="11" fill="#64748b">两个标签页分别读 sessions[A] 与 sessions[B]，图标互不影响（这是与现有同类插件的差别）。</text>
</svg>
