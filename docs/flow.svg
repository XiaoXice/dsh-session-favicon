<svg xmlns="http://www.w3.org/2000/svg" width="764" height="356" viewBox="0 0 764 356" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
  </marker></defs>

<rect x="24" y="38" width="306" height="224" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="38" y="62" font-size="13" font-weight="700" fill="#0f172a">Host 半边（Node 进程）</text>
<g><rect x="38" y="74" width="148" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="47" y="90" font-size="10.5" fill="#0f172a">agent/status</text></g>
<g><rect x="194" y="74" width="108" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="203" y="90" font-size="10.5" fill="#0f172a">agent/error</text></g>
<g><rect x="38" y="104" width="148" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="47" y="120" font-size="10.5" fill="#0f172a">approval/request</text></g>
<g><rect x="194" y="104" width="122" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="203" y="120" font-size="10.5" fill="#0f172a">user-questions/request</text></g>
<g><rect x="38" y="140" width="278" height="46" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
     <text x="50" y="159" font-size="11.5" fill="#0f172a">每会话状态机</text><text x="50" y="175" font-size="10.5" fill="#64748b">idle / running / asking / done / error + since</text></g>
<g><rect x="38" y="196" width="278" height="46" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
     <text x="50" y="215" font-size="11.5" fill="#0f172a">GET /dsh-session-favicon.json</text><text x="50" y="231" font-size="10.5" fill="#64748b">{ aggregate, sessions: { id: { state, since } } }</text></g>
<path d="M 120 128 L 120 140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 120 186 L 120 196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M 318 219 L 420 219" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="322" y="211" font-size="10.5" fill="#64748b">同源 JSON</text>

<rect x="424" y="38" width="316" height="224" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="438" y="62" font-size="13" font-weight="700" fill="#0f172a">浏览器（每个标签页各一份）</text>
<g><rect x="438" y="74" width="288" height="46" rx="7" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
     <text x="450" y="93" font-size="11.5" fill="#0f172a">Slot props.sessionId</text><text x="450" y="109" font-size="10.5" fill="#64748b">本标签页正在看哪个会话</text></g>
<g><rect x="438" y="130" width="288" height="46" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
     <text x="450" y="149" font-size="11.5" fill="#0f172a">每 800ms 轮询</text><text x="450" y="165" font-size="10.5" fill="#64748b">只取 sessions[自己的 id] 这一行</text></g>
<g><rect x="438" y="186" width="288" height="46" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
     <text x="450" y="205" font-size="11.5" fill="#0f172a">canvas 合成</text><text x="450" y="221" font-size="10.5" fill="#64748b">原图标 + 右下角徽标</text></g>
<path d="M 582 120 L 582 130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 582 176 L 582 186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="24" y="292" font-size="12" font-weight="600" fill="#0f172a">关键点：会话身份只来自 Slot props，不来自 URL</text>
<text x="24" y="312" font-size="11" fill="#64748b">DSH web 没有会话路由，所有标签页共享同一份宿主快照；所以每个标签页必须自己取自己那一行。</text>
<text x="24" y="332" font-size="11" fill="#64748b">A 标签页读 sessions[A]、B 标签页读 sessions[B]，图标互不影响——这就是与现有同类插件的差别。</text>
</svg>
