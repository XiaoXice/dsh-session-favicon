  <path d="M19 22h18M19 32h12" stroke="#8b98ab" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44.5" cy="44.5" r="12.5" fill="#5b6a80"/>
  <circle cx="44.5" cy="44.5" r="9.5" fill="#22c55e"/>
</svg>
