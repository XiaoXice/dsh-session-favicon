<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Session status favicon">
  <!-- A tab with a session-status badge in its bottom-right corner. Original artwork.
       Mid-tone palette on purpose: the Plugin Manager draws this row on both the light
       and the dark theme, and the shipped favicons do the same job with #000 / #fff. -->
